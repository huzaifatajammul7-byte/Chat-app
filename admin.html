<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b141a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
<div class="splash" id="splash">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg></div>
  <div class="spinner big"></div>
</div>

<div class="admin">
  <div class="topbar">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg></div>
    <h1>Admin panel</h1>
    <button class="btn ghost" id="refresh" type="button">Refresh</button>
    <button class="btn ghost" id="logout" type="button">Log out</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="sUsers">–</b><span>Total users</span></div>
    <div class="stat"><b id="sOnline">–</b><span>Online now</span></div>
    <div class="stat"><b id="sMsgs">–</b><span>Messages</span></div>
  </div>

  <div class="search"><div class="box" style="display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:0 14px;height:44px">
    <input id="q" placeholder="Search by name or email" autocomplete="off" style="flex:1;font-size:14px">
  </div></div>

  <div class="u-list" id="rows"></div>
</div>

<div class="modal hidden" id="confirm">
  <div class="modal-card">
    <h3 id="cTitle">Delete user?</h3>
    <p id="cText"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="cNo" type="button">Cancel</button>
      <button class="btn danger" id="cYes" type="button">Delete user</button>
    </div>
  </div>
</div>

<script type="module" src="/src/admin.js"></script>
</body>
</html>
